<svg width="300" height="300" viewBox="0 0 300 300">
  <!-- Clip lục giác để cắt ảnh -->
  <defs>
    <clipPath id="hexClip">
      <polygon points="150,10 280,75 280,225 150,290 20,225 20,75" />
    </clipPath>

    <!-- Gradient vàng (có thể đổi thành màu vàng cố định nếu muốn) -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>
  </defs>

  <!-- Viền vàng -->
  <polygon
    points="150,10 280,75 280,225 150,290 20,225 20,75"
    fill="none"
    stroke="url(#goldGradient)"
    stroke-width="5"
  />

  <!-- Ảnh bên trong -->
  <image
    href="./your-image.jpg"
    width="300"
    height="300"
    clip-path="url(#hexClip)"
    preserveAspectRatio="xMidYMid slice"
  />
</svg>
