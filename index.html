<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Embed font -->
    <link rel="stylesheet" href="./fonts/stylesheet.css" />

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="wrapper">
      <!-- start of header -->
      <header class="header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-12">
              <div class="header__inner">
                <!-- logo -->
                <a href="#!" class="header__logo">
                  <img
                    src="https://framerusercontent.com/images/UbZzFWYYu1TrWNIRXOJEZpjlC0.png?scale-down-to=512"
                    alt=""
                  />
                </a>

                <!-- navigation -->
                <nav class="header__nav-bar">
                  <ul class="header__nav-bar-list">
                    <li class="header__nav-bar-item">
                      <a href="#!" class="header__nav-bar-link">SẢN PHẨM</a>
                    </li>
                    <li class="header__nav-bar-item">
                      <a href="#!" class="header__nav-bar-link">CÂU CHUYỆN</a>
                    </li>
                    <li class="header__nav-bar-item">
                      <a href="#!" class="header__nav-bar-link">BÀI VIẾT</a>
                    </li>
                    <li class="header__nav-bar-item">
                      <a href="#!" class="header__nav-bar-link">LIÊN HỆ</a>
                    </li>
                  </ul>
                </nav>

                <!-- action -->
                <div class="header__action-buy">
                  <p>MUA HÀNG</p>
                </div>

                <div class="header__icon-more">
                  <svg
                    style="width: 100%; height: 100%"
                    viewBox="0 0 32 32"
                    preserveAspectRatio="none"
                    width="100%"
                    height="100%"
                  >
                    <use href="#svg1136278496_1114"></use>
                  </svg>
                </div>
                <!-- decor left -->
                <img
                  src="https://framerusercontent.com/images/j4UOhc5DEdGrBCUYIoFU5norKbg.webp"
                  alt=""
                  class="header__decor-left"
                />

                <!-- decor right -->
                <img
                  src="https://framerusercontent.com/images/j4UOhc5DEdGrBCUYIoFU5norKbg.webp"
                  alt=""
                  class="header__decor-right"
                />
              </div>
            </div>
          </div>
        </div>
      </header>
      <!-- End of header -->

      <!-- End of main -->
      <main class="main"></main>
      <!-- End of main -->

      <!-- End of footer -->
      <footer class="footer"></footer>
      <!-- End of footer -->
    </div>
  </body>
</html>
